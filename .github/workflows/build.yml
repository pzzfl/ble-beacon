name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能给 Release 传附件

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Prepare artifact
        run: |
          mkdir -p out
          SUFFIX="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then SUFFIX="snapshot-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "out/ble-beacon-${SUFFIX}.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ble-beacon-apk
          path: out/*.apk

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
